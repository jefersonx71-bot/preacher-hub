<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#0e1b30" />
      <stop offset="100%" stop-color="#05080e" />
    </radialGradient>
    
    <!-- Primary Cyan Glow Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Accent Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#dfaa4b" />
    </linearGradient>

    <!-- Subtle Page Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4"/>

  <!-- Stylized Pulpit / Open Book with Outlines -->
  <g transform="translate(0, 10)" filter="url(#glow)">
    <!-- Left Page / Outline Node Base -->
    <path d="M 236 170 Q 180 150 110 180 L 110 370 Q 180 340 236 360 Z" fill="none" stroke="url(#primaryGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Right Page / Outline Node Base -->
    <path d="M 276 170 Q 332 150 402 180 L 402 370 Q 332 340 276 360 Z" fill="none" stroke="url(#primaryGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Book Spine / Center Line -->
    <line x1="256" y1="175" x2="256" y2="370" stroke="url(#primaryGrad)" stroke-width="12" stroke-linecap="round" />

    <!-- Left Page Lines (representing text outline list) -->
    <!-- First outline item (indented node connector) -->
    <path d="M 140 230 L 210 230" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
    <!-- Second outline item (deeper node) -->
    <path d="M 160 270 L 210 270" stroke="url(#primaryGrad)" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
    <circle cx="145" cy="270" r="4" fill="url(#primaryGrad)"/>
    <!-- Third outline item -->
    <path d="M 140 310 L 210 310" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" opacity="0.9"/>

    <!-- Right Page Lines (representing text outline list) -->
    <!-- First outline item -->
    <path d="M 276 230 L 372 230" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
    <!-- Second outline item -->
    <path d="M 302 270 L 372 270" stroke="url(#primaryGrad)" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
    <circle cx="287" cy="270" r="4" fill="url(#primaryGrad)"/>
    <!-- Third outline item -->
    <path d="M 276 310 L 372 310" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
    
    <!-- Rising Golden Flame/Cross representing the holy spirit / preaching energy -->
    <!-- Stylized flame / dynamic spark shape in center top -->
    <path d="M 256 100 Q 276 130 256 160 Q 236 130 256 100 Z" fill="url(#goldGrad)" />
    <!-- Cross/Spark rays -->
    <line x1="256" y1="80" x2="256" y2="155" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <line x1="230" y1="125" x2="282" y2="125" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
